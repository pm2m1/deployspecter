<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · DeploySpecter</title>
<meta name="description" content="Run deployment concurrency tests on local PostgreSQL, inspect timelines, and replay failures.">
<meta name="theme-color" content="#0b0d11">
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/css/tokens.css">
<link rel="stylesheet" href="static/css/app.css">
</head>
<body>
<a class="skip-link" href="#workspace">Skip to the workspace</a>
<header class="app-top">
  <a class="brand" href="./"><img src="static/favicon.svg" alt="" width="26" height="26">DeploySpecter</a>
  <span class="badge">Workbench</span>
  <span class="health" role="status"><span id="health-dot" class="health-dot" aria-hidden="true"></span><span id="health">Checking PostgreSQL…</span></span>
</header>
<div class="app-shell">
  <aside class="app-side">
    <nav><div class="app-tabs" role="tablist" aria-label="Workbench sections" aria-orientation="vertical" id="tabs"></div></nav>
    <p class="side-note">This page runs tests on your local PostgreSQL and uses recorded model responses. It makes no model requests.</p>
  </aside>
  <main class="app-main" id="workspace">
    <section role="tabpanel" id="tab-guided" aria-labelledby="btn-guided"></section>
    <section role="tabpanel" id="tab-scenarios" aria-labelledby="btn-scenarios" hidden></section>
    <section role="tabpanel" id="tab-gitlab" aria-labelledby="btn-gitlab" hidden></section>
    <section role="tabpanel" id="tab-pipeline" aria-labelledby="btn-pipeline" hidden></section>
    <section role="tabpanel" id="tab-comparison" aria-labelledby="btn-comparison" hidden></section>
  </main>
</div>
<script type="module" src="static/js/app/main.js"></script>
</body>
</html>
