<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeploySpecter</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#17181a;--muted:#5b5f66;--line:#dcdcd6;--bad:#a8201a;--bad-bg:#fbe9e7;--good:#14703f;--good-bg:#e3f3ea;--warn:#7d5100;--warn-bg:#faf0d7;--accent:#2a4aa3;--accent-bg:#e8edfa;--code:#efefea}
@media (prefers-color-scheme:dark){:root{--bg:#131416;--panel:#1c1e21;--ink:#ececea;--muted:#a3a7ae;--line:#33363b;--bad:#f28a82;--bad-bg:#3a1f1c;--good:#74d2a0;--good-bg:#16301f;--warn:#e5bb60;--warn-bg:#352a11;--accent:#9db4ff;--accent-bg:#1f2740;--code:#26282c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 28px 0;background:var(--panel);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
h2{font-size:21px;margin:0 0 12px}
h3{font-size:17px;margin:18px 0 6px}
p{margin:8px 0}
a{color:var(--accent)}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);padding:9px 14px;font-weight:600}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1360px;margin:0 auto;padding:22px 28px 48px}
section[role=tabpanel]{display:grid;gap:18px}
section[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
label{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:14px;font-weight:600;color:var(--muted);min-width:0;max-width:100%}
select,input,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);max-width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:650}
button:disabled{opacity:.55;cursor:wait}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:650;vertical-align:middle}
.bad{background:var(--bad-bg);color:var(--bad)}.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.info{background:var(--accent-bg);color:var(--accent)}
.verdict{border-radius:9px;padding:15px 17px;margin:12px 0}
.verdict strong.big{display:block;font-size:20px;line-height:1.3}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:10px}
.compare>div{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.compare span{display:block;font-size:13px;font-weight:650;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:650;white-space:nowrap;font-size:14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.gone td{background:var(--bad-bg);color:var(--bad)}
code,pre{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
code{background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--code);padding:12px;border-radius:7px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.lane{min-width:180px}
.step .meta{color:var(--muted);display:block;font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.step.txn{color:var(--muted)}
.step.blocked{border-left:3px solid var(--warn);padding-left:7px}
.step.err{border-left:3px solid var(--bad);padding-left:7px}
.step.evidence{border-left:3px solid var(--accent);padding-left:7px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:15px;margin:6px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
details{margin-top:10px;font-size:15px}summary{cursor:pointer;color:var(--accent);font-weight:600}
ul{margin:6px 0;padding-left:20px}
.note{font-size:15px;color:var(--muted)}
p,li,summary,h3{overflow-wrap:anywhere}
ol.flow{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
ol.flow>li{counter-increment:s;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px}
ol.flow>li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--panel);display:grid;place-items:center;font-weight:700}
.who{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;margin:8px 0}
.chain span{background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:6px;font-weight:600}
@media (max-width:640px){body{font-size:16px}header{padding:16px 16px 0}main{padding:16px 16px 36px}.panel{padding:15px}.lane{min-width:150px}}
</style>
</head>
<body>
<header>
  <h1>DeploySpecter</h1>
  <div class="sub">Finds and reproduces data corruption from rolling database deployments, on real PostgreSQL. This page makes no model requests. <span id="health"></span></div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main>
  <section role="tabpanel" id="tab-gitlab"></section>
  <section role="tabpanel" id="tab-scenarios" hidden></section>
  <section role="tabpanel" id="tab-pipeline" hidden></section>
  <section role="tabpanel" id="tab-comparison" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
// Data is written with textContent only. Model output and SQL are never parsed as HTML.
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k === "onclick") node.onclick = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}
const fmt = (v) => (v === null || v === undefined ? "n/a" : typeof v === "object" ? JSON.stringify(v) : String(v));
const fmtRows = (rows) => rows.length ? rows.map((r) => Object.entries(r).map(([k, v]) => `${k} = ${fmt(v)}`).join(", ")).join("; ") : "none";
const getJson = async (url) => {
  const response = await fetch(url);
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.detail || `HTTP ${response.status}`);
  }
  return response.json();
};
const inlineSql = (r) => {
  let s = r.sql || r.kind.toUpperCase();
  for (const [k, v] of Object.entries(r.params || {})) s = s.replaceAll(`%(${k})s`, typeof v === "string" ? `'${v}'` : fmt(v));
  return s;
};

function timelineTable(view) {
  const evidence = new Set((view.violations || []).flatMap((v) => v.evidence || []));
  const actors = [...new Set(view.timeline.map((r) => r.actor))];
  const head = el("tr", {}, el("th", {class: "num", text: "#"}), ...actors.map((a) => el("th", {class: "lane", text: a})));
  const rows = view.timeline.map((r) => {
    const cells = actors.map((a) => {
      if (a !== r.actor) return el("td");
      const cls = ["step"];
      if (r.kind !== "sql") cls.push("txn");
      if (r.blocked_by.length) cls.push("blocked");
      if (r.status === "error") cls.push("err");
      if (evidence.has(r.seq)) cls.push("evidence");
      const facts = [];
      if (r.kind === "sql" && r.rowcount !== null) facts.push(`rows ${r.rowcount}`);
      if (r.rows && r.rows.length) facts.push(`read ${JSON.stringify(r.rows)}`);
      if (r.blocked_by.length) facts.push(`waited for ${r.blocked_by.join(", ")}`);
      if (r.committed === true && r.kind !== "sql") facts.push("committed");
      if (r.status !== "ok") facts.push(r.status);
      if (r.error) facts.push(r.error);
      return el("td", {}, el("div", {class: cls.join(" ")}, el("code", {text: inlineSql(r)}),
        facts.length ? el("span", {class: "meta", text: facts.join(" · ")}) : null));
    });
    return el("tr", {}, el("td", {class: "num", text: r.seq}), ...cells);
  });
  return el("div", {class: "scroll"}, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows)));
}

function rowsTable(rows, goneRows = []) {
  if (!rows.length) return el("p", {class: "note", text: "No rows."});
  const cols = Object.keys(rows[0]);
  const gone = new Set(goneRows.map((r) => JSON.stringify(r)));
  return el("div", {class: "scroll"}, el("table", {},
    el("thead", {}, el("tr", {}, ...cols.map((c) => el("th", {text: c})))),
    el("tbody", {}, ...rows.map((r) => el("tr", gone.has(JSON.stringify(r)) ? {class: "gone"} : {}, ...cols.map((c) => el("td", {text: fmt(r[c])})))))));
}

function stateTables(state) {
  return el("div", {}, ...Object.entries(state || {}).map(([table, rows]) => el("div", {}, el("h3", {text: table}), rowsTable(rows))));
}

function replayControl(runId) {
  const out = el("div", {class: "note"});
  const button = el("button", {class: "primary", text: "Replay this failure on PostgreSQL"});
  button.onclick = async () => {
    button.disabled = true;
    out.textContent = "Re-executing the saved schedule…";
    try {
      const response = await fetch(`/runs/${runId}/replay`, {method: "POST"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const r = await response.json();
      const found = r.violations.map((v) => `${v.requirement_id}: expected ${fmt(v.expected)}, actual ${fmt(v.actual)}`).join("; ");
      out.replaceChildren(
        el("p", {}, el("span", {class: `badge ${r.reproduced ? "good" : "warn"}`, text: r.reproduced ? "Reproduced" : "Did not reproduce"})),
        el("p", {text: `Re-executed ${r.attempts} times just now. Identical behaviour ${r.fingerprints_match} of ${r.attempts}. Same violation ${r.violations_match} of ${r.attempts}. ${found}`}),
        stateTables(r.final_state));
    } catch (err) { out.textContent = `Replay failed: ${err.message}`; }
    button.disabled = false;
  };
  return el("div", {}, button, out);
}

function verdict(view) {
  if (view.error) return el("div", {class: "verdict warn"}, el("strong", {class: "big", text: "Not executed"}), el("div", {text: view.error}));
  if (!view.schedules_executed) {
    const reason = view.rejections.length ? view.rejections[0].reasons[0] : "No test could be executed.";
    return el("div", {class: "verdict warn"}, el("strong", {class: "big", text: "Nothing executed"}), el("div", {text: reason}));
  }
  if (!view.detected) {
    return el("div", {class: "verdict good"}, el("strong", {class: "big", text: "No stated requirement violated in the schedules run"}),
      el("div", {text: `${view.schedules_executed} schedules on PostgreSQL. This is not a proof that the code is safe.`}));
  }
  const v = view.violations[0];
  return el("div", {class: "verdict bad"},
    el("strong", {class: "big", text: "Verified violation"}),
    el("div", {}, el("strong", {text: `${v.requirement_id}: `}), v.requirement),
    el("div", {text: v.explanation}),
    el("div", {class: "compare"},
      el("div", {}, el("span", {text: "Expected"}), fmt(v.expected)),
      el("div", {}, el("span", {text: "Actual in PostgreSQL"}), fmt(v.actual)),
      el("div", {}, el("span", {text: "First failure"}), `schedule ${view.schedules_to_first_failure} of ${view.schedules_executed}`),
      el("div", {}, el("span", {text: "Needs concurrency?"}), view.serial_order_violation ? "No: a serial order also fails" : "Yes: no serial order failed")));
}

function specDetails(view) {
  const d = el("details", {}, el("summary", {text: `Test specifications from ${view.generator}: ${view.tests_valid} valid, ${view.rejections.length} rejected`}));
  for (const t of view.tests) {
    if (!t.spec) continue;
    d.append(el("h3", {text: t.name}));
    if (t.spec.rationale) d.append(el("p", {class: "note", text: t.spec.rationale}));
    d.append(el("pre", {text: t.spec.actors.map((a) => `${a.name}  (${a.function})\n${a.steps.map((s) => "  " + s).join("\n")}`).join("\n\n")}));
    d.append(el("p", {class: "note", text: `Seed: ${JSON.stringify(t.spec.seed)}`}));
    d.append(el("p", {class: "note", text: `${t.executed} of ${t.space_size} interleavings run, ${t.violations} violating`}));
    if (Object.keys(t.renamed_actors).length) d.append(el("p", {class: "note", text: `Actor names normalized: ${JSON.stringify(t.renamed_actors)}`}));
    for (const i of t.invariants) {
      if (i.failed_without_oracle_violation > 0 && !i.screened_out) d.append(el("p", {class: "note", text: `Unconfirmed model hypothesis, not a finding: ${i.description}`}));
    }
  }
  for (const r of view.rejections) d.append(el("p", {class: "note", text: `Rejected ${r.test}: ${r.reasons.join("; ")}`}));
  return d;
}

function resultBody(view, runId) {
  const box = el("div", {}, verdict(view));
  if (view.timeline) {
    box.append(el("h3", {text: view.detected ? "Failing interleaving (minimized)" : "Example interleaving"}), timelineTable(view));
    box.append(el("div", {class: "cols"},
      el("div", {}, el("h3", {text: "Before"}), stateTables(view.initial_state)),
      el("div", {}, el("h3", {text: "After (read from PostgreSQL)"}), stateTables(view.final_state))));
  }
  if (view.replay) {
    const r = view.replay, m = view.minimized_replay;
    box.append(el("h3", {text: "Replay"}),
      el("p", {class: "note", text: `When found: original ${r.fingerprints_match} of ${r.attempts} identical, minimized ${m ? m.fingerprints_match + " of " + m.attempts : "n/a"} identical. Reduced from ${view.minimized.before.steps} to ${view.minimized.after.steps} steps.`}),
      replayControl(runId), el("pre", {text: view.replay_command}));
  }
  box.append(specDetails(view));
  if (view.assumptions) {
    const d = el("details", {}, el("summary", {text: "Oracle assumptions"}));
    d.append(el("ul", {}, ...view.assumptions.map((a) => el("li", {text: a}))));
    box.append(d);
  }
  if (view.report_markdown) box.append(el("details", {}, el("summary", {text: "Full report and manual replay"}), el("pre", {text: view.report_markdown})));
  for (const n of view.notes) box.append(el("p", {class: "note", text: n}));
  return box;
}

async function pollRun(runId, onDone, onFail) {
  for (;;) {
    const record = await getJson(`/runs/${runId}`);
    if (record.status === "finished") return onDone(record.result, runId);
    if (record.status === "failed") return onFail(record.error);
    await new Promise((r) => setTimeout(r, 300));
  }
}

async function runCard(url, body, card, render) {
  const target = card.querySelector(".body");
  target.textContent = "Running on PostgreSQL…";
  const post = await fetch(url, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body)});
  if (!post.ok) { target.textContent = `Request failed: HTTP ${post.status}`; return; }
  const {run_id} = await post.json();
  await pollRun(run_id, (view, id) => target.replaceChildren(render(view, id)), (error) => { target.textContent = error; });
}

function variantCards(host) {
  const cards = [["buggy", "Buggy version"], ["corrected", "Corrected version"]].map(([variant, title]) => {
    const card = el("section", {class: "panel", "data-variant": variant}, el("h2", {text: title}), el("div", {class: "body note", text: "Waiting…"}));
    host.append(card);
    return [variant, card];
  });
  return cards;
}

function sourcePanel(src, labels) {
  const files = new Set([...Object.keys(src.variants.buggy), ...Object.keys(src.variants.corrected)]);
  return [...files].sort().map((name) => {
    const differs = src.differing_files.includes(name);
    const d = el("details", {}, el("summary", {text: differs ? `${name} (differs between versions)` : name}));
    if (differs) d.setAttribute("open", "");
    d.append(differs
      ? el("div", {class: "cols"},
          el("div", {}, el("h3", {text: labels[0]}), el("pre", {text: src.variants.buggy[name]})),
          el("div", {}, el("h3", {text: labels[1]}), el("pre", {text: src.variants.corrected[name]})))
      : el("pre", {text: src.variants.buggy[name]}));
    return d;
  });
}

/* ---------- GitLab-derived case ---------- */
function documentedResult(view, runId) {
  const f = view.documented;
  const box = el("div", {});
  if (view.error || !f) { box.append(verdict(view)); return box; }
  const lost = f.destination_row_disappeared.length > 0;
  box.append(lost
    ? el("div", {class: "verdict bad"},
        el("strong", {class: "big", text: "The destination row disappeared while a source row remains"}),
        el("div", {class: "compare"},
          el("div", {}, el("span", {text: `Removed from ${f.destination_table}`}), fmtRows(f.destination_row_disappeared)),
          el("div", {}, el("span", {text: `Still in ${f.source_table}`}), fmtRows(f.source_rows_remaining)),
          el("div", {}, el("span", {text: "Requirement"}), view.violations ? view.violations[0].requirement : "n/a")))
    : el("div", {class: "verdict good"},
        el("strong", {class: "big", text: "The destination row was kept"}),
        el("div", {class: "compare"},
          el("div", {}, el("span", {text: `In ${f.destination_table}`}), fmtRows(f.destination_after)),
          el("div", {}, el("span", {text: `Still in ${f.source_table}`}), fmtRows(f.source_after))),
        el("div", {text: `No stated requirement violated in this test's ${f.schedules} schedules. This is not a proof of safety.`})));
  box.append(el("h3", {text: "Timeline"}), timelineTable(view));
  box.append(el("div", {class: "cols"},
    el("div", {}, el("h3", {text: `${f.source_table} (source)`}), el("p", {class: "note", text: "Before"}), rowsTable(f.source_before), el("p", {class: "note", text: "After"}), rowsTable(f.source_after)),
    el("div", {}, el("h3", {text: `${f.destination_table} (destination)`}), el("p", {class: "note", text: "Before"}), rowsTable(f.destination_before, f.destination_row_disappeared), el("p", {class: "note", text: "After"}), rowsTable(f.destination_after))));
  if (f.fails_in_serial_order) {
    box.append(el("h3", {text: "Why this does not need concurrency"}),
      el("p", {text: `Measured here: the smallest failing test is ${f.actors_in_minimal_failure} actor and ${f.transactions_in_minimal_failure} transaction, with no other session involved. ${f.violating_schedules} of ${f.schedules} schedules fail, including serial orders. The trigger's delete branch removes the pair without checking for remaining source rows, so ordering plays no part. This makes it a migration semantics defect rather than a race.`}));
  }
  if (view.replay) box.append(el("h3", {text: "Replay"}), replayControl(runId), el("pre", {text: view.replay_command}));
  return box;
}

async function renderGitlab() {
  const tab = $("tab-gitlab");
  const [info] = await getJson("/external-cases");
  const src = await getJson(`/external-cases/${info.id}/source`);
  const results = el("div", {class: "cols"});
  const run = el("button", {class: "primary", text: "Run the documented defect on both versions"});
  run.onclick = async () => {
    run.disabled = true;
    results.replaceChildren();
    const url = `/external-cases/${info.id}/documented-defect/run`;
    for (const [variant, card] of variantCards(results)) {
      card.querySelector("h2").textContent = variant === "buggy" ? "Original trigger" : "GitLab's corrected logic";
      await runCard(url, {variant}, card, documentedResult);
    }
    run.disabled = false;
  };
  tab.replaceChildren(
    el("div", {class: "panel"},
      el("h2", {}, `${info.title} `, el("span", {class: "badge info", text: "External case, separate from the benchmark"})),
      el("h3", {text: "Documented by GitLab"}),
      el("ul", {}, ...info.documented_by_gitlab.map((t) => el("li", {text: t}))),
      el("p", {}, ...info.links.flatMap((l, i) => [i ? " · " : "", el("a", {href: l.url, target: "_blank", rel: "noreferrer", text: l.label})]))),
    el("div", {class: "panel"},
      el("h2", {text: "Minimal fixture"}),
      el("p", {class: "note", text: "Independently written tables and trigger that model the documented behaviour. Each file is shown exactly as it runs."}),
      ...sourcePanel(src, ["Original trigger", "GitLab's corrected logic"])),
    el("div", {class: "panel"},
      el("h2", {text: "Reproduce it"}),
      el("p", {class: "note", text: "Runs on PostgreSQL: seeds two access levels for one user and project, deletes one, then reads both tables."}),
      run),
    results,
    el("div", {class: "panel"},
      el("h2", {text: "Limits of this example"}),
      el("ul", {}, ...info.limitations.map((t) => el("li", {text: t})))));
}

/* ---------- Benchmark scenarios ---------- */
const GENERATORS = [["hand", "Hand-authored reference"], ["baseline", "Baseline B (non-LLM)"], ["baseline_c", "Baseline C (non-LLM, added later)"], ["ai", "Muse Spark (recorded responses)"]];

function allScores(data) {
  return Object.values(data).flatMap((r) => r.scores || []).filter((s, i, a) => s.system !== "hand" || a.findIndex((x) => x.case_id === s.case_id && x.system === "hand") === i);
}

function scenarioScoreTable(scenario) {
  const rows = allScores(savedReports).filter((s) => s.case_id.startsWith(`${scenario}/`));
  if (!rows.length) return el("p", {class: "note", text: "No saved benchmark data."});
  const finding = (s) => {
    if (s.system === "baseline_a_static") return s.flagged ? "Warning, not executed" : "No warning";
    if (s.tests_proposed !== null && !s.schedules_executed) return "No test executed";
    return s.flagged ? "Violation" : "No violation";
  };
  const heads = ["Version", "System", "Run", "Finding", "Schedules to failure", "Needs concurrency", "Valid tests", "Replayed"];
  return el("div", {class: "scroll"}, el("table", {},
    el("thead", {}, el("tr", {}, ...heads.map((h) => el("th", {text: h})))),
    el("tbody", {}, ...rows.map((s) => el("tr", {},
      el("td", {text: s.has_bug ? "Buggy" : "Corrected"}), el("td", {text: s.system}), el("td", {class: "num", text: s.repeat}),
      el("td", {text: finding(s)}), el("td", {class: "num", text: fmt(s.schedules_to_first_failure)}),
      el("td", {text: s.serial_order_violation === null ? "n/a" : (s.serial_order_violation ? "No" : "Yes")}),
      el("td", {class: "num", text: s.tests_proposed === null ? "n/a" : `${s.tests_valid}/${s.tests_proposed}`}),
      el("td", {text: s.replay_ok === null ? "n/a" : (s.replay_ok ? "Yes" : "No")}))))));
}

function renderScenarios(list) {
  const tab = $("tab-scenarios");
  const scenario = el("select", {id: "scenario"}, ...list.map((s) => el("option", {value: s.id, text: `${s.title} (${s.split})`})));
  const generator = el("select", {id: "generator"}, ...GENERATORS.map(([v, t]) => el("option", {value: v, text: t})));
  const budget = el("input", {id: "budget", type: "number", min: "1", max: "2000", value: "300"});
  const run = el("button", {class: "primary", id: "run", text: "Run both versions"});
  const desc = el("p", {}), requirement = el("p", {class: "note"}), source = el("div", {class: "note"});
  const results = el("div", {class: "cols", id: "results"}), saved = el("div", {});
  const describe = async () => {
    const s = list.find((x) => x.id === scenario.value);
    desc.textContent = s.description;
    requirement.textContent = `Independent requirement, hidden from test generators: ${s.requirements.join(" ")}`;
    saved.replaceChildren(el("h2", {}, "This scenario in the benchmark ", el("span", {class: "badge warn", text: "Saved benchmark data"})), scenarioScoreTable(s.id));
    const src = await getJson(`/scenarios/${s.id}/source`);
    source.replaceChildren(...sourcePanel(src, ["Buggy version", "Corrected version"]));
  };
  scenario.onchange = describe;
  run.onclick = async () => {
    run.disabled = true;
    results.replaceChildren();
    for (const [variant, card] of variantCards(results)) {
      await runCard(`/scenarios/${scenario.value}/run`, {variant, generator: generator.value, max_schedules: Number(budget.value)}, card, resultBody);
    }
    run.disabled = false;
  };
  tab.replaceChildren(
    el("div", {class: "panel"},
      el("h2", {text: "Benchmark scenarios"}),
      el("div", {class: "controls"},
        el("label", {}, "Scenario", scenario), el("label", {}, "Test generator", generator), el("label", {}, "Schedule budget", budget), run),
      desc, requirement),
    el("div", {class: "panel"}, el("h2", {text: "Deployment under test"}), source),
    results,
    el("div", {class: "panel"}, saved));
  return describe();
}

/* ---------- Muse Spark pipeline ---------- */
function proposalCard(t) {
  const p = t.proposal;
  const calls = p.actors.map((a) => `${a.name}  (${a.function})\n` + a.calls.map((c) => {
    const params = c.params.map((x) => `${x.name}=${x.source === "literal" ? JSON.stringify(x.value) : `${x.bind}[${x.row}].${x.column}${x.transform !== "none" ? ` ${x.transform}` : ""}`}`).join(", ");
    return `  ${c.statement_id}${params ? `  ${params}` : ""}${c.bind_as ? `  → ${c.bind_as}` : ""}`;
  }).join("\n")).join("\n\n");
  return el("div", {},
    el("h3", {}, `${p.name} `, el("span", {class: `badge ${t.accepted ? "good" : "bad"}`, text: t.accepted ? "Accepted by validator" : "Rejected by validator"})),
    p.rationale ? el("p", {class: "note", text: p.rationale}) : null,
    el("pre", {text: calls}),
    el("p", {class: "note", text: `Seed rows: ${JSON.stringify(p.seed.map((s) => ({[s.table]: Object.fromEntries(s.values.map((v) => [v.column, v.value]))})))}`}),
    p.invariants.length ? el("details", {}, el("summary", {text: `${p.invariants.length} candidate invariants (hypotheses, never findings)`}),
      el("ul", {}, ...p.invariants.map((i) => el("li", {text: `${i.kind}: ${i.description}`})))) : null,
    t.rejections.length ? el("ul", {}, ...t.rejections.map((r) => el("li", {text: r}))) : null,
    Object.keys(t.renamed_actors).length ? el("p", {class: "note", text: `Actor names normalized: ${JSON.stringify(t.renamed_actors)}`}) : null,
    el("details", {}, el("summary", {text: "Raw recorded proposal"}), el("pre", {text: JSON.stringify(p, null, 2)})));
}

function renderPipeline(list) {
  const tab = $("tab-pipeline");
  const scenario = el("select", {id: "ai-scenario"}, ...list.map((s) => el("option", {value: s.id, text: `${s.title} (${s.split})`})));
  const variant = el("select", {id: "ai-variant"}, el("option", {value: "buggy", text: "Buggy version"}), el("option", {value: "corrected", text: "Corrected version"}));
  const repeat = el("select", {id: "ai-repeat"});
  // Offers only recordings that exist. The API still answers a clear 404 for any other request.
  const fillRecordings = async () => {
    const available = await getJson(`/scenarios/${scenario.value}/recordings`);
    const runs = available[variant.value];
    const current = repeat.value === "" ? null : Number(repeat.value);
    repeat.replaceChildren(...runs.map((r) => el("option", {value: r, text: `Recorded run ${r}`})));
    if (runs.length) repeat.value = String(runs.includes(current) ? current : runs[0]);
    return runs.length > 0;
  };
  const body = el("div", {});
  const load = async () => {
    body.textContent = "Loading the recorded response…";
    if (!(await fillRecordings())) {
      body.replaceChildren(el("div", {class: "verdict warn"}, el("strong", {class: "big", text: "No recording"}), el("div", {text: "No recorded model response exists for this case."})));
      return;
    }
    let d;
    try { d = await getJson(`/scenarios/${scenario.value}/ai-pipeline?variant=${variant.value}&repeat=${repeat.value}`); }
    catch (err) { body.replaceChildren(el("div", {class: "verdict warn"}, el("strong", {class: "big", text: "No recording"}), el("div", {text: err.message}))); return; }
    const scored = d.as_scored_in_saved_benchmark;
    const usage = d.attempts.map((a) => `${a.kind}: ${a.status}, ${a.input_tokens} input and ${a.output_tokens} output tokens, ${a.latency_seconds}s${a.parse_error ? ", failed parsing" : ""}`).join("; ");
    const result = el("div", {class: "panel", "data-result": "ai"}, el("div", {class: "body note", text: "Not run yet."}));
    const execute = el("button", {class: "primary", id: "ai-execute", text: "Execute these recorded tests on PostgreSQL"});
    execute.onclick = async () => {
      execute.disabled = true;
      await runCard(`/scenarios/${scenario.value}/run`, {variant: variant.value, generator: "ai", repeat: Number(repeat.value)}, result, resultBody);
      execute.disabled = false;
    };
    body.replaceChildren(el("ol", {class: "flow"},
      el("li", {}, el("div", {}, el("div", {class: "who", text: "Submitted code"}), el("h3", {text: "Source code and migration"}),
        ...Object.entries(d.files).map(([n, text]) => el("details", {}, el("summary", {text: n}), el("pre", {text}))))),
      el("li", {}, el("div", {}, el("div", {class: "who", text: "Static extraction, no AI"}), el("h3", {text: `Operation catalog: ${d.catalog.length} statements`}),
        el("div", {class: "scroll"}, el("table", {}, el("thead", {}, el("tr", {}, ...["statement_id", "Path", "SQL"].map((h) => el("th", {text: h})))),
          el("tbody", {}, ...d.catalog.map((c) => el("tr", {}, el("td", {}, el("code", {text: c.statement_id})), el("td", {text: c.required ? "required" : "optional"}), el("td", {}, el("code", {text: c.sql}))))))))),
      el("li", {}, el("div", {}, el("div", {class: "who", text: "Muse Spark"}),
        el("h3", {}, "Recorded test proposal ", el("span", {class: "badge warn", text: "Recorded response, no request made"})),
        el("p", {class: "note", text: `${d.model}, prompt ${d.prompt_version}. ${usage}.`}),
        d.conflicts.length ? el("details", {open: ""}, el("summary", {text: `Application-aware conflicts it identified: ${d.conflicts.length}`}),
          el("ul", {}, ...d.conflicts.map((c) => el("li", {text: `${c.table}.${c.column}: ${c.risk_explanation}`})))) : null,
        ...d.tests.map(proposalCard),
        d.tests.length ? null : el("p", {class: "note", text: "This recording contains no usable tests."}))),
      el("li", {}, el("div", {}, el("div", {class: "who", text: "Validator, no AI"}), el("h3", {text: "What the validator allowed"}),
        el("p", {text: `Current validator: ${d.tests.filter((t) => t.accepted).length} of ${d.tests.length} tests accepted. A proposal cannot contain SQL, and every statement must exist in the submitted source.`}),
        scored ? el("p", {class: "note", text: `As scored in the saved benchmark (${scored.generated_at}): first response ${fmt(scored.first_attempt_valid)} of ${fmt(scored.first_attempt_proposed)} valid, final ${scored.tests_valid} of ${scored.tests_proposed}.${scored.rejections.length ? ` Rejected then: ${scored.rejections.map((r) => r.slice(0, 160)).join(" | ")}` : ""}`}) : null)),
      el("li", {}, el("div", {}, el("div", {class: "who", text: "PostgreSQL, no AI"}), el("h3", {text: "Execution over real interleavings"}), execute)),
      el("li", {}, el("div", {}, el("div", {class: "who", text: "Independent oracle, no AI"}), el("h3", {text: "Verified result and replay"}),
        el("p", {class: "note", text: "Only the oracle can produce a finding. It was written by hand and is hidden from every generator."}), result))));
  };
  scenario.onchange = variant.onchange = repeat.onchange = load;
  tab.replaceChildren(
    el("div", {class: "panel"},
      el("h2", {text: "What Muse Spark does here"}),
      el("div", {class: "chain"}, ...["Source code", "Operation catalog", "Muse Spark proposal", "Validator", "PostgreSQL", "Oracle", "Reproducible failure"].flatMap((s, i) => [i ? "→" : "", el("span", {text: s})])),
      el("ul", {},
        el("li", {text: "Muse Spark proposes application-aware tests and candidate invariants from the code."}),
        el("li", {text: "The validator rejects anything unsupported or unsafe. Generated output cannot carry SQL."}),
        el("li", {text: "PostgreSQL executes the accepted tests over bounded interleavings."}),
        el("li", {text: "The independent oracle alone decides whether a verified violation exists."})),
      el("p", {class: "note", text: "Muse Spark did not find more defects than the non-LLM baselines. See the comparison tab."})),
    el("div", {class: "panel"}, el("div", {class: "controls"},
      el("label", {}, "Scenario", scenario), el("label", {}, "Version", variant), el("label", {}, "Recording", repeat))),
    el("div", {class: "panel"}, body));
  return load();
}

/* ---------- Comparison ---------- */
function rollup(scores, system) {
  const rows = scores.filter((s) => s.system === system);
  const bugs = rows.filter((s) => s.has_bug), clean = rows.filter((s) => !s.has_bug);
  const executed = clean.filter((s) => system === "baseline_a_static" || s.schedules_executed > 0);
  const firsts = bugs.map((s) => s.schedules_to_first_failure).filter((v) => v).sort((a, b) => a - b);
  const median = firsts.length ? (firsts.length % 2 ? firsts[(firsts.length - 1) / 2] : (firsts[firsts.length / 2 - 1] + firsts[firsts.length / 2]) / 2) : null;
  const skipped = clean.length - executed.length;
  return {
    runs: rows.length, found: bugs.filter((s) => s.flagged).length, bugs: bugs.length,
    falseFlags: executed.filter((s) => s.flagged).length, executed: executed.length, skipped, median,
    valid: rows.reduce((n, s) => n + (s.tests_valid || 0), 0), proposed: rows.reduce((n, s) => n + (s.tests_proposed || 0), 0),
    first: rows.reduce((n, s) => n + (s.first_attempt_valid || 0), 0), firstOf: rows.reduce((n, s) => n + (s.first_attempt_proposed || 0), 0),
    schedules: rows.reduce((n, s) => n + (s.schedules_executed || 0), 0), replayed: bugs.filter((s) => s.replay_ok).length,
    requests: rows.reduce((n, s) => n + (s.requests || 0), 0), seconds: rows.reduce((n, s) => n + (s.inference_seconds || 0), 0),
    cost: rows.reduce((n, s) => n + (s.approx_cost_usd || 0), 0),
  };
}

const SYSTEMS = [["ai", "Muse Spark (recorded)"], ["baseline_b", "Baseline B (non-LLM)"], ["baseline_c", "Baseline C (non-LLM, added later)"], ["hand", "Hand-authored"], ["baseline_a_static", "Static rules"]];

function summaryTable(scores, title) {
  const heads = ["System", "Defects found", "Replayed", "False flags", "Median schedules to failure", "Valid tests", "Schedules", "Requests", "Inference", "Est. cost"];
  return el("div", {}, el("h3", {text: title}), el("div", {class: "scroll"}, el("table", {},
    el("thead", {}, el("tr", {}, ...heads.map((h) => el("th", {text: h})))),
    el("tbody", {}, ...SYSTEMS.map(([id, name]) => {
      const r = rollup(scores, id);
      if (!r.runs) return null;
      const isStatic = id === "baseline_a_static";
      return el("tr", {},
        el("td", {text: name}), el("td", {class: "num", text: `${r.found}/${r.bugs}${isStatic ? " (warnings)" : ""}`}),
        el("td", {class: "num", text: isStatic ? "not executed" : `${r.replayed}/${r.found}`}),
        el("td", {class: "num", text: `${r.falseFlags}/${r.executed}${r.skipped ? ` (${r.skipped} not executed)` : ""}`}),
        el("td", {class: "num", text: fmt(r.median)}),
        el("td", {class: "num", text: r.proposed ? `${r.valid}/${r.proposed}` : "n/a"}),
        el("td", {class: "num", text: r.schedules}),
        el("td", {class: "num", text: r.requests || "none"}),
        el("td", {class: "num", text: r.requests ? `${r.seconds.toFixed(0)}s` : "none"}),
        el("td", {class: "num", text: r.requests ? `$${r.cost.toFixed(2)}` : "none"}));
    })))));
}

function renderComparison(data, usage) {
  const tab = $("tab-comparison");
  if (!Object.keys(data).length) { tab.replaceChildren(el("div", {class: "panel", text: "No benchmark has been run yet."})); return; }
  const cScores = data.baseline_c ? data.baseline_c.scores.filter((s) => s.system === "baseline_c") : [];
  const split = (name) => [...((data[name] || {}).scores || []), ...cScores.filter((s) => s.split === name)];
  const scores = [...split("heldout"), ...split("dev")];
  const ai = rollup(scores, "ai"), best = Math.max(...["baseline_b", "baseline_c"].map((s) => { const r = rollup(scores, s); return r.bugs ? r.found / r.bugs : 0; }));
  const scenarios = [...new Set(scores.filter((s) => s.has_bug).map((s) => s.case_id.split("/")[0]))];
  const perScenario = el("div", {class: "scroll"}, el("table", {},
    el("thead", {}, el("tr", {}, ...["Scenario", "Split", "Muse Spark", "Baseline B", "Baseline C", "Hand-authored"].map((h) => el("th", {text: h})))),
    el("tbody", {}, ...scenarios.map((sc) => {
      const cell = (system) => {
        const rows = scores.filter((s) => s.system === system && s.case_id === `${sc}/buggy`);
        if (!rows.length) return "n/a";
        const firsts = [...new Set(rows.map((s) => s.schedules_to_first_failure))].join(", ");
        const manner = rows.some((s) => s.matches_reference_manifestation === false) ? " (differs from reference)" : "";
        return `${firsts}${manner}`;
      };
      const row = scores.find((s) => s.case_id === `${sc}/buggy`);
      return el("tr", {}, el("td", {text: sc}), el("td", {text: row.split}), ...["ai", "baseline_b", "baseline_c", "hand"].map((s) => el("td", {class: "num", text: cell(s)})));
    }))));
  const v1 = usage.versions.v1, v2 = usage.versions.v2;
  const limits = [
    `First-response test validity: ${ai.first} of ${ai.firstOf} across recorded runs.`,
    data.heldout ? `Held-out run: ${data.heldout.scores.filter((s) => s.system === "ai" && !s.schedules_executed).map((s) => s.case_id).join(", ") || "every case"} ${data.heldout.scores.some((s) => s.system === "ai" && !s.schedules_executed) ? "produced no executable test, because actor names were rejected at the time." : "executed."}` : null,
    v1 ? `${v1.requests} earlier requests were void because of a bug in this project's response schema, not the model. They are kept as a usage record.` : null,
    v2 ? `Recorded usage for valid prompts: ${v2.requests} requests, ${v2.output_tokens} output tokens, $${v2.estimated_usd.toFixed(2)} estimated.` : null,
    ...(data.dev && data.dev.notes ? data.dev.notes : []),
  ].filter(Boolean);
  tab.replaceChildren(
    el("div", {class: "panel"},
      el("h2", {}, "AI versus non-AI ", el("span", {class: "badge warn", text: "Saved benchmark data"})),
      ai.bugs && ai.found / ai.bugs <= best ? el("div", {class: "verdict warn"}, el("strong", {class: "big", text: "No measured detection advantage for Muse Spark"}),
        el("div", {text: "Muse Spark found no greater share of the seeded defects than the non-LLM baselines. Its runs count per repeat, so its totals include repeated cases."})) : null,
      data.heldout ? summaryTable(split("heldout"), `Held-out cases, ${data.heldout.budget.schedules_per_case} schedules per case`) : null,
      data.dev ? summaryTable(split("dev"), `Development cases, ${data.dev.budget.schedules_per_case} schedules per case`) : null,
      el("h3", {text: "Schedules to first failure, by scenario"}), perScenario,
      el("p", {class: "note", text: "A smaller number costs milliseconds, while a model response takes about a minute. Baseline C was added after the original evaluation and adjusted with these fixtures in view, so its results are not blind."})),
    el("div", {class: "panel"}, el("h2", {text: "Recorded limitations"}),
      el("ul", {}, ...limits.map((t) => el("li", {text: t}))),
      el("p", {class: "note", text: "Tokens are as reported by the API in recorded responses. Costs are estimates at published rates, not billing data. Small, author-designed benchmark: results do not generalize."})));
}

/* ---------- Shell ---------- */
const TABS = [["gitlab", "GitLab-derived case"], ["scenarios", "Benchmark scenarios"], ["pipeline", "Muse Spark pipeline"], ["comparison", "AI vs non-AI"]];
let savedReports = {};

window.addEventListener("hashchange", () => {
  const name = location.hash.slice(1);
  if (TABS.some(([id]) => id === name)) selectTab(name);
});

function selectTab(name) {
  for (const [id] of TABS) {
    $(`tab-${id}`).hidden = id !== name;
    $(`btn-${id}`).setAttribute("aria-selected", id === name);
  }
  history.replaceState(null, "", `#${name}`);
}

async function init() {
  for (const [id, title] of TABS) $("tabs").append(el("button", {id: `btn-${id}`, role: "tab", text: title, onclick: () => selectTab(id)}));
  const start = location.hash.slice(1);
  selectTab(TABS.some(([id]) => id === start) ? start : "gitlab");
  const health = await getJson("/health");
  $("health").textContent = health.database.reachable ? `PostgreSQL ${health.database.server_version.split(" ")[0]} reachable.` : "PostgreSQL is not reachable.";
  const [list, data, usage] = await Promise.all([getJson("/scenarios"), getJson("/comparison"), getJson("/usage")]);
  savedReports = data;
  renderComparison(data, usage);
  await Promise.all([renderGitlab(), renderScenarios(list), renderPipeline(list)]);
}
init().catch((err) => { $("health").textContent = `Failed to load: ${err.message}`; });
</script>
